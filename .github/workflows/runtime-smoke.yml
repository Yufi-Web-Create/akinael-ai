name: Runtime Smoke

on:
  push:
    branches:
      - feat/workflow-execution-engine
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GENERAL_AGENT_MODEL: ${{ vars.GENERAL_AGENT_MODEL || 'gpt-5.6-terra' }}
  AKINAEL_GITHUB_APP_ID: ${{ secrets.AKINAEL_GITHUB_APP_ID }}
  AKINAEL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.AKINAEL_GITHUB_APP_PRIVATE_KEY }}
  AKINAEL_BOT_USER: ${{ vars.AKINAEL_BOT_USER }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check central runner readiness without exposing secret values
        run: node scripts/runtime-smoke.mjs
