name: Core Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'akinael/**'
  pull_request:
    branches: [main]

concurrency:
  group: core-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix portal
      - run: npm --prefix portal test
      - run: npm --prefix portal run lint
      - run: npm --prefix portal run build
      - name: Run Portal browser E2E
        env:
          CHROMIUM_BIN: google-chrome
          PORTAL_E2E_ARTIFACT_DIR: ${{ github.workspace }}/portal/test-artifacts
        run: npm --prefix portal run test:e2e
      - name: Upload Portal browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-e2e
          path: portal/test-artifacts/
          if-no-files-found: error
