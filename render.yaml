services:
  - type: web
    name: akinael-ai
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://akinael-ai.com
      # Transitional local persistence. Remove after all business repositories use Supabase.
      - key: DATA_FILE
        value: /var/data/store.json
      - key: STORAGE_DIR
        value: /var/data/uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AKINAEL_TENANT_NAME
        value: akinael
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: OpenAI
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1/chat/completions
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NOTIFICATION_PROVIDER
        value: Resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
    disk:
      name: akinael-data
      mountPath: /var/data
      sizeGB: 1
