name: Akinael Agent
run-name: ${{ inputs.run_name }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Core task UUID
        required: true
        type: string
      workflow_run_id:
        description: Core workflow UUID
        required: true
        type: string
      target_repository:
        description: Customer repository owner/name
        required: true
        type: string
      target_owner:
        description: Customer repository owner
        required: true
        type: string
      target_repo:
        description: Customer repository name
        required: true
        type: string
      target_default_branch:
        description: Customer repository default branch
        required: true
        default: main
        type: string
      branch_name:
        description: Isolated Akinael work branch
        required: true
        type: string
      permission_profile:
        description: Codex permission profile
        required: true
        default: ':read-only'
        type: string
      task_mode:
        description: Core task execution mode
        required: true
        default: execute
        type: string
      stage:
        description: execute, review, or correction
        required: true
        type: string
      cycle:
        description: correction cycle
        required: true
        default: '0'
        type: string
      model:
        description: Approved Codex model for this stage
        required: true
        default: gpt-5.6-terra
        type: string
      effort:
        description: Codex reasoning effort
        required: true
        default: medium
        type: string
      run_name:
        description: Correlation name used by Core
        required: true
        type: string
      prompt:
        description: Task prompt produced by Core
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  AKINAEL_GITHUB_APP_ID: '4762113'
  AKINAEL_BOT_USER: 'akinael-ai-runtime-yufi[bot]'

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_OWNER: ${{ inputs.target_owner }}
          TARGET_REPO: ${{ inputs.target_repo }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          STAGE: ${{ inputs.stage }}
          CYCLE: ${{ inputs.cycle }}
          PERMISSION_PROFILE: ${{ inputs.permission_profile }}
          TASK_MODE: ${{ inputs.task_mode }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$WORKFLOW_RUN_ID" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$TARGET_OWNER" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$TARGET_REPOSITORY" == "$TARGET_OWNER/$TARGET_REPO" ]]
          [[ "$BRANCH_NAME" =~ ^akinael/run-[A-Za-z0-9-]+$ ]]
          [[ "$STAGE" =~ ^(execute|review|correction)$ ]]
          [[ "$CYCLE" =~ ^[0-9]+$ ]]
          [[ "$PERMISSION_PROFILE" == ':workspace' || "$PERMISSION_PROFILE" == ':read-only' ]]
          [[ "$TASK_MODE" =~ ^[a-z0-9_-]+$ ]]
          [[ "$MODEL" =~ ^gpt-[A-Za-z0-9.-]+$ ]]
          [[ "$EFFORT" =~ ^(low|medium|high)$ ]]

      - name: Create scoped GitHub App token
        id: target-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.AKINAEL_GITHUB_APP_ID }}
          private-key: ${{ secrets.AKINAEL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ inputs.target_owner }}
          repositories: ${{ inputs.target_repo }}

      - name: Checkout customer repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_default_branch }}
          token: ${{ steps.target-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated work branch
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$TARGET_TOKEN" | base64 -w0)"
          if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags origin "$BRANCH_NAME"
            git switch -C "$BRANCH_NAME" FETCH_HEAD
          else
            git switch -c "$BRANCH_NAME"
          fi
          git config user.name "$AKINAEL_BOT_USER"
          git config user.email 'akinael-ai-runtime-yufi[bot]@users.noreply.github.com'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare existing project dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi
          if [ -f package.json ] && node -e "const p=require('./package.json');process.exit((p.dependencies?.['@playwright/test']||p.devDependencies?.['@playwright/test'])?0:1)"; then
            npx --no-install playwright install --with-deps
          fi

      - name: Capture visual review evidence
        if: inputs.task_mode == 'visual_review' && inputs.stage == 'review'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .akinael/visual-evidence
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('tests/__akinael_visual_evidence.spec.ts', `import { test } from '@playwright/test';

          test('capture visual review evidence', async ({ page }, testInfo) => {
            await page.goto('/');
            const width = testInfo.project.use.viewport?.width || 0;
            await page.screenshot({
              path: \`.akinael/visual-evidence/viewport-\${width}.png\`,
              fullPage: true
            });
          });
          `);
          NODE
          npx --no-install playwright test tests/__akinael_visual_evidence.spec.ts --workers=1

      - name: Run Codex
        id: codex
        # Action v1.12 still loses the GitHub-hosted runner on this production
        # workload even with CLI 0.150.0. Pin the last verified heavy-run-safe
        # wrapper (v1.11) while retaining the CLI fix from openai/codex-action#150.
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.150.0'
          model: ${{ inputs.model }}
          permission-profile: ${{ inputs.permission_profile }}
          safety-strategy: drop-sudo
          allow-bot-users: ${{ env.AKINAEL_BOT_USER }}
          effort: ${{ inputs.effort }}
          codex-args: ${{ inputs.task_mode == 'visual_review' && inputs.stage == 'review' && '["--image",".akinael/visual-evidence/viewport-360.png","--image",".akinael/visual-evidence/viewport-768.png","--image",".akinael/visual-evidence/viewport-1280.png"]' || '' }}
          prompt: ${{ inputs.prompt }}

      - name: Restore protected control files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git restore --source=HEAD --staged --worktree -- .github 2>/dev/null || true
          git restore --source=HEAD --staged --worktree -- AGENTS.md 2>/dev/null || true
          rm -rf .codex
          rm -f tests/__akinael_visual_evidence.spec.ts
          rm -rf .akinael/visual-evidence
          if [ -d .akinael ]; then
            find .akinael -mindepth 1 -maxdepth 1 ! -name results -exec rm -rf -- {} +
          fi

      - name: Reconcile generated dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi
          if [ -f package.json ] && node -e "const p=require('./package.json');process.exit((p.dependencies?.['@playwright/test']||p.devDependencies?.['@playwright/test'])?0:1)"; then
            npx --no-install playwright install
          fi
          exit 0

      - name: Run repository QA
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        id: qa
        if: always()
        shell: bash
        run: |
          set +e
          conclusion=success
          if [ -f package.json ] && node -e "const p=require('./package.json');process.exit(p.scripts?.qa?0:1)"; then
            npm run qa
            code=$?
          elif [ -f package.json ] && node -e "const p=require('./package.json');process.exit(p.scripts?.test?0:1)"; then
            npm test
            code=$?
          else
            code=1
          fi
          if [ "$code" -ne 0 ]; then conclusion=failure; fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write machine-readable task result
        if: always()
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          STAGE: ${{ inputs.stage }}
          CYCLE: ${{ inputs.cycle }}
          FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          QA_CONCLUSION: ${{ steps.qa.outputs.conclusion }}
          CODEX_CONCLUSION: ${{ steps.codex.conclusion }}
        run: |
          set -euo pipefail
          result_path=".akinael/results/${TASK_ID}-${STAGE}-${CYCLE}.json"
          mkdir -p "$(dirname "$result_path")"
          RESULT_PATH="$result_path" node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync(process.env.RESULT_PATH, JSON.stringify({
            task_id: process.env.TASK_ID,
            stage: process.env.STAGE,
            cycle: Number(process.env.CYCLE || 0),
            final_message: process.env.FINAL_MESSAGE || '',
            qa_conclusion: process.env.QA_CONCLUSION || 'unknown',
            codex_conclusion: process.env.CODEX_CONCLUSION || 'unknown',
            generated_at: new Date().toISOString()
          }, null, 2));
          NODE

      - name: Commit safe customer workspace changes and result
        if: always()
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          TASK_ID: ${{ inputs.task_id }}
          STAGE: ${{ inputs.stage }}
          CYCLE: ${{ inputs.cycle }}
        run: |
          set -euo pipefail
          git add -A
          while IFS= read -r path; do
            case "$path" in
              .github/*|.codex/*|AGENTS.md) echo "Protected path changed: $path" >&2; exit 1 ;;
              .akinael/*) [[ "$path" == .akinael/results/* ]] || { echo "Reserved path changed: $path" >&2; exit 1; } ;;
            esac
          done < <(git diff --cached --name-only)

          if ! git diff --cached --quiet; then
            git commit -m "Akinael ${TASK_ID} ${STAGE} ${CYCLE}"
            auth="$(printf 'x-access-token:%s' "$TARGET_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags origin "$BRANCH_NAME"
            git rebase FETCH_HEAD
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH_NAME"
          fi
