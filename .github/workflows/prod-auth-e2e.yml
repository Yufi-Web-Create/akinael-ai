name: Production Auth E2E

on:
  push:
    branches:
      - test/prod-auth-e2e-20260916

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register a disposable test address through production
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="delivered+akinael-${GITHUB_RUN_ID}@resend.dev"
          PASSWORD="E2eOnly-${GITHUB_RUN_ID}-Aa1!"
          echo "E2E_EMAIL=${EMAIL}"
          BODY=$(printf '{"email":"%s","password":"%s"}' "$EMAIL" "$PASSWORD")
          RESPONSE_FILE=$(mktemp)
          STATUS=$(curl --silent --show-error --location \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data "$BODY" \
            'https://akinael-ai.com/api/v2/auth/register')
          echo "HTTP_STATUS=${STATUS}"
          cat "$RESPONSE_FILE"
          echo
          test "$STATUS" = "202"
          grep -q 'confirmationRequired' "$RESPONSE_FILE"

  portal-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify live portal registration link
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          page.on('console', (message) => {
            if (message.type() === 'error') errors.push(message.text());
          });
          page.on('pageerror', (error) => errors.push(error.message));
          const response = await page.goto('https://akinael-ai.com/portal/', { waitUntil: 'networkidle' });
          if (!response || !response.ok()) throw new Error(`portal HTTP status: ${response?.status()}`);
          if (!page.url().startsWith('https://akinael-ai.com/portal/')) throw new Error(`unexpected portal url: ${page.url()}`);
          const signup = page.getByRole('link', { name: '新規アカウント登録はこちら' });
          await signup.waitFor({ state: 'visible' });
          await signup.click();
          await page.waitForLoadState('networkidle');
          if (page.url() !== 'https://akinael-ai.com/#register') throw new Error(`unexpected signup target: ${page.url()}`);
          if (errors.length) throw new Error(`browser errors: ${errors.join(' | ')}`);
          console.log(`PORTAL_SIGNUP_TARGET=${page.url()}`);
          await browser.close();
          NODE
